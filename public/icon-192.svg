<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!-- Blue rounded background -->
  <rect width="192" height="192" rx="32" fill="#2563eb"/>
  <!-- House roof (triangle) -->
  <polygon points="96,38 148,82 44,82" fill="#ffffff"/>
  <!-- House body -->
  <rect x="54" y="82" width="84" height="62" fill="#ffffff" rx="2"/>
  <!-- Door -->
  <rect x="82" y="104" width="28" height="40" rx="3" fill="#2563eb"/>
  <!-- Door handle -->
  <circle cx="104" cy="126" r="2.5" fill="#ffffff"/>
  <!-- Left window -->
  <rect x="60" y="92" width="18" height="16" rx="2" fill="#2563eb" opacity="0.7"/>
  <!-- Right window -->
  <rect x="114" y="92" width="18" height="16" rx="2" fill="#2563eb" opacity="0.7"/>
  <!-- Chimney -->
  <rect x="118" y="42" width="14" height="30" rx="2" fill="#ffffff" opacity="0.9"/>
  <!-- Ground line -->
  <rect x="36" y="144" width="120" height="4" rx="2" fill="#ffffff" opacity="0.3"/>
</svg>
